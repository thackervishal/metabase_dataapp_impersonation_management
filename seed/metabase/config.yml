version: 1
config:
  settings:
    site-name: "{{ env MB_SITE_NAME }}"
    site-locale: en
    allow-tracking: false
  users:
    - first_name: Admin
      last_name: User
      email: "{{ env MB_ADMIN_EMAIL }}"
      password: "{{ env MB_ADMIN_PASSWORD }}"
      is_superuser: true
    # Demo people, the same three names used in the MySQL and SQL Server RLS demos.
    # Each is impersonated as a Postgres person role (see scripts/setup-app.mjs, which
    # sets each one's db_role attribute and group membership). All demo passwords are
    # metabot1.
    - first_name: Bruce
      last_name: Wayne
      email: bruce@example.com
      password: metabot1
    - first_name: Thor
      last_name: Odinson
      email: thor@example.com
      password: metabot1
    - first_name: Frodo
      last_name: Baggins
      email: frodo@example.com
      password: metabot1
  api-keys:
    - name: Automation Admin Key
      creator: "{{ env MB_ADMIN_EMAIL }}"
      group: admin
      key: "{{ env MB_AUTOMATION_API_KEY }}"
  databases:
    - name: dwh
      engine: postgres
      details:
        host: sample-dwh
        port: 5432
        user: metabase_reader
        password: "{{ env SAMPLE_DWH_METABASE_ROLE_PASSWORD }}"
        dbname: "{{ env SAMPLE_DWH_DB }}"
        ssl: false
